[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crosschat"
version = "0.3.0"
description = "A method for agents to talk to each other — fire-and-forget messaging between Claude Code sessions over NATS."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kaushik Hazra" }]
keywords = ["claude", "claude-code", "agents", "nats", "messaging", "multi-agent"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
]
dependencies = [
    "nats-py>=2.9.0",
    # Ed25519 signing. A hard dependency rather than an extra: a project that
    # cannot sign is indistinguishable on the wire from one that chooses not
    # to, and attribution that is off by default attributes nothing. The
    # import is still guarded so a stripped install degrades to unsigned
    # rather than failing to start.
    "pynacl>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/kaushikhazra/crosschat"
Repository = "https://github.com/kaushikhazra/crosschat"
Issues = "https://github.com/kaushikhazra/crosschat/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
crosschat = "crosschat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crosschat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
